plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "ru.a510.gpsmanager"
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "ru.a510.gpsmanager"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode 1000 + (System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 1)
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        release {
            // Для личной установки; для публикации нужен отдельный ключ.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter { source "../.." }
