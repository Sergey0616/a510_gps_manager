plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "ru.a510.gpsmanager"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "ru.a510.gpsmanager"
        minSdk 24
        targetSdk 34
        // versionCode/versionName берутся из pubspec.yaml
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }

    buildTypes {
        release {
            // Для личной установки; для публикации нужен отдельный ключ.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter { source "../.." }
