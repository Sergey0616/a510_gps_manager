name: a510_gps_manager
description: Личный GPS-менеджер для видеорегистратора 70mai A510
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  connectivity_plus: ^6.0.0
  xml: ^6.5.0
  intl: ^0.19.0
  provider: ^6.1.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
